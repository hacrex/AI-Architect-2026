version: '3.8'

services:
  inference-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - MODEL_NAME=gpt2
      - MODEL_DEVICE=cpu
      - MAX_TOKENS=2048
      - BATCH_SIZE=16
      - ENABLE_METRICS=true
    volumes:
      - ../config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - inference-server

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data:
